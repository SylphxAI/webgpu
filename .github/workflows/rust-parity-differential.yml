name: rust-parity-differential

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: rust-parity-differential-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  differential:
    name: webgpu-buffer-mapping-differential
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native binding (host)
        run: bun run build

      - name: Run buffer-mapping differential
        run: bash scripts/run-webgpu-differential.sh

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-differential-verification
          path: /tmp/webgpu-differential/verification.json
          if-no-files-found: warn
