name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows MSVC residual: no Sylphx self-hosted Windows runners yet.
        # Re-add win32 targets when windows runners exist (do not use GitHub-hosted).
        settings:
          - host: [self-hosted, sylphx, macos, standard]
            target: x86_64-apple-darwin
          - host: [self-hosted, sylphx, macos, standard]
            target: aarch64-apple-darwin
          - host: sylphx-linux-standard
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
          - host: sylphx-linux-standard
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: bun install

      - name: Build in docker
        if: ${{ matrix.settings.docker }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/build \
            -w /build \
            ${{ matrix.settings.docker }} \
            sh -c "rustup override set 1.81 && rustup target add ${{ matrix.settings.target }} && npm install && npm run build -- --target ${{ matrix.settings.target }}"

      - name: Build (macOS ARM64)
        if: ${{ !matrix.settings.docker && matrix.settings.target == 'aarch64-apple-darwin' }}
        run: |
          sudo rm -Rf /Library/Developer/CommandLineTools/SDKs/*
          export CC=$(xcrun -f clang)
          export CXX=$(xcrun -f clang++)
          SYSROOT=$(xcrun --sdk macosx --show-sdk-path)
          export CFLAGS="-isysroot $SYSROOT -isystem $SYSROOT"
          bun run build --target ${{ matrix.settings.target }}
        shell: bash

      - name: Build
        if: ${{ !matrix.settings.docker && matrix.settings.target != 'aarch64-apple-darwin' }}
        run: bun run build --target ${{ matrix.settings.target }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error

  release:
    needs: build
    uses: SylphxAI/.github/.github/workflows/release.yml@main
    with:
      artifact: 'bindings-*'
      postpublish: bun run release:readback
      prepublish: |
        mkdir -p npm/darwin-x64 npm/darwin-arm64 npm/linux-x64-gnu npm/linux-arm64-gnu npm/win32-x64-msvc npm/win32-arm64-msvc
        mv artifacts/bindings-x86_64-apple-darwin/*.node npm/darwin-x64/ 2>/dev/null || true
        mv artifacts/bindings-aarch64-apple-darwin/*.node npm/darwin-arm64/ 2>/dev/null || true
        mv artifacts/bindings-x86_64-unknown-linux-gnu/*.node npm/linux-x64-gnu/ 2>/dev/null || true
        mv artifacts/bindings-aarch64-unknown-linux-gnu/*.node npm/linux-arm64-gnu/ 2>/dev/null || true
        mv artifacts/bindings-x86_64-pc-windows-msvc/*.node npm/win32-x64-msvc/ 2>/dev/null || true
        mv artifacts/bindings-aarch64-pc-windows-msvc/*.node npm/win32-arm64-msvc/ 2>/dev/null || true
        bun scripts/create-platform-packages.js
    secrets: inherit
