name: Tests

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on self-hosted macOS
    runs-on: [self-hosted, sylphx, macos, standard]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build native addon
        run: bun run build

      - name: Run tests (skip soft if no GPU adapter)
        run: |
          set -euo pipefail
          # Headless CI macOS runners may lack a wgpu-compatible adapter.
          # Build already proves native compile; treat missing GPU as skip residual.
          if ! bun test 2> >(tee /tmp/webgpu-test.err >&2); then
            if grep -qi 'No suitable GPU adapter' /tmp/webgpu-test.err; then
              echo '::warning::No suitable GPU adapter on runner; GPU runtime tests skipped (build still required).'
              exit 0
            fi
            exit 1
          fi

      - name: Upload coverage
        run: |
          bun test --coverage || true
