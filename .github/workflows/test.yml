name: Tests

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Runtime WebGPU tests need a runner with a suitable GPU adapter.
        # Cross-platform native artifact compilation remains covered by ci.yml.
        os: [self-hosted-macos]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build native addon
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Upload coverage
        run: bun test --coverage
